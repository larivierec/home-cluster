---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy
  namespace: flux-system
spec:
  interval: 10m
  path: "./kubernetes/main/apps/networking/gateway/envoy/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: envoy-gateway-crds
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: envoy-gateway-crds-source
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/envoyproxy/gateway
  ref:
    # renovate: datasource=github-releases depName=envoyproxy/gateway
    tag: v1.10.0
  ignore: |
    # exclude
    /*
    # include the Envoy Gateway CRDs, but not Gateway API CRDs
    !charts
    /charts/*
    !charts/gateway-helm
    /charts/gateway-helm/*
    !charts/gateway-helm/charts
    /charts/gateway-helm/charts/*
    !charts/gateway-helm/charts/crds
    /charts/gateway-helm/charts/crds/*
    !charts/gateway-helm/charts/crds/crds
    /charts/gateway-helm/charts/crds/crds/*
    !charts/gateway-helm/charts/crds/crds/generated
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  interval: 15m
  path: "./charts/gateway-helm/charts/crds/crds/generated"
  prune: true
  sourceRef:
    kind: GitRepository
    name: envoy-gateway-crds-source
  wait: true
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-manifests
  namespace: flux-system
spec:
  interval: 10m
  path: "./kubernetes/main/apps/networking/gateway/envoy/manifests"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  dependsOn:
    - name: envoy
