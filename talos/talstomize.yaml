---
apiVersion: config.talstomize.dev/v1alpha1
kind: Talstomize
clusterName: garb
controlPlaneEndpoint: https://192.168.60.250:6443
# renovate: datasource=custom.talos-factory depName=siderolabs/talos
talosVersion: v1.14.4
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.1
secrets: ./talsecret.sops.yaml
dnsDomain: cluster.local
additionalSubjectAltNames:
  - 192.168.60.250
  - garb.cluster.local
  - 127.0.0.1

installer:
  schematic:
    customization:
      extraKernelArgs:
        - intel_iommu=on
        - iommu=pt
        - mitigations=off
        - -selinux
        - net.ifnames=0
      systemExtensions:
        officialExtensions:
          - siderolabs/gasket-driver
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/mei
          - siderolabs/nfsrahead
          - siderolabs/thunderbolt

patches:
  - apiVersion: v1alpha1
    kind: KubeNodeConfig
    nodeIP:
      validSubnets:
        - 192.168.60.0/24
  - apiVersion: v1alpha1
    kind: KubeletConfig
    config:
      serializeImagePulls: false
    extraArgs:
      image-gc-low-threshold: "50"
      image-gc-high-threshold: "55"
      rotate-server-certificates: "true"
  - apiVersion: v1alpha1
    kind: ResolverConfig
    searchDomains:
      disableDefault: true
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: false
      resolveMemberNames: true
  - apiVersion: v1alpha1
    kind: KubePrismConfig
    port: 7445
  - apiVersion: v1alpha1
    kind: SysctlConfig
    params:
      fs.inotify.max_queued_events: "65536"
      fs.inotify.max_user_watches: "524288"
      fs.inotify.max_user_instances: "8192"
      net.core.rmem_max: "7500000"
      net.core.wmem_max: "7500000"
  - apiVersion: v1alpha1
    kind: KubeNetworkConfig
    podSubnets:
      - 10.42.0.0/16
    serviceSubnets:
      - 10.43.0.0/16
  - apiVersion: v1alpha1
    kind: CRICustomizationConfig
    name: 20-customization
    content: |
      [plugins."io.containerd.cri.v1.runtime"]
        cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
        device_ownership_from_security_context = true
      [plugins."io.containerd.cri.v1.images"]
        discard_unpacked_layers = false
  - apiVersion: v1alpha1
    kind: EtcFileConfig
    name: nfsmount.conf
    mode: 0o644
    contents: |
      [ NFSMount_Global_Options ]
        nfsvers = 4.1
        hard = True
        noatime = True
        nodiratime = True
        rsize = 131072
        wsize = 131072
        nconnect = 8

controlplanePatches:
  - apiVersion: v1alpha1
    kind: KubeNodeConfig
    taints:
      node-role.kubernetes.io/control-plane:
        $patch: delete
  - apiVersion: v1alpha1
    kind: KubeAPIServerConfig
    extraArgs:
      feature-gates: MutatingAdmissionPolicy=true
      runtime-config: admissionregistration.k8s.io/v1beta1=true
  - apiVersion: v1alpha1
    kind: KubeAuditPolicyConfig
    configuration:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: Metadata
  - apiVersion: v1alpha1
    kind: KubeAdmissionControlConfig
    name: PodSecurity
    $patch: delete
  - apiVersion: v1alpha1
    kind: KubeTalosAPIAccessConfig
    allowedRoles:
      - os:admin
    allowedKubernetesNamespaces:
      - system-upgrade
  - apiVersion: v1alpha1
    kind: KubeControllerManagerConfig
    extraArgs:
      bind-address: 0.0.0.0
  - apiVersion: v1alpha1
    kind: KubeSchedulerConfig
    extraArgs:
      bind-address: 0.0.0.0
  - apiVersion: v1alpha1
    kind: KubeCoreDNSConfig
    enabled: false
  - apiVersion: v1alpha1
    kind: KubeProxyConfig
    enabled: false
  - apiVersion: v1alpha1
    kind: KubeExternalManifestConfig
    name: prometheus-operator-crds
    url: https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.94.1/stripped-down-crds.yaml
  - apiVersion: v1alpha1
    kind: KubeExternalManifestConfig
    name: gateway-api-standard
    url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
  - apiVersion: v1alpha1
    kind: KubeExternalManifestConfig
    name: external-dns-dnsendpoints-crd
    url: https://raw.githubusercontent.com/kubernetes-sigs/external-dns/refs/tags/v0.23.0/config/crd/standard/dnsendpoints.externaldns.k8s.io.yaml
  - apiVersion: v1alpha1
    kind: KubeExternalManifestConfig
    name: dragonfly-operator-crd
    url: https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/refs/tags/v1.7.1/manifests/crd.yaml
  - cluster:
      etcd:
        extraArgs:
          listen-metrics-urls: http://0.0.0.0:2381
        advertisedSubnets:
          - 192.168.60.0/24

nodes:
  talos-m1:
    ip: 192.168.60.5
    kind: controlplane
    patches:
      - apiVersion: v1alpha1
        kind: UnattendedInstallConfig
        provisioning:
          diskSelector:
            match: 'disk.size >= 500000000000u && disk.model == "Samsung SSD 990 PRO 1TB"'
          wipe: false
      - apiVersion: v1alpha1
        kind: KubeNodeConfig
        labels:
          node.kubernetes.io/gpu: "true"
          topology.kubernetes.io/region: garb
          topology.kubernetes.io/zone: m
      - apiVersion: v1alpha1
        kind: BondConfig
        name: bond0
        links:
          - enp2s0f0np0
          - enp2s0f1np1
        bondMode: 802.3ad
        miimon: 100
        updelay: 200
        downdelay: 200
        xmitHashPolicy: layer3+4
        lacpRate: fast
        mtu: 9000
      - apiVersion: v1alpha1
        kind: DHCPv4Config
        name: bond0
      - apiVersion: v1alpha1
        kind: Layer2VIPConfig
        name: 192.168.60.250
        link: bond0

  talos-m2:
    ip: 192.168.60.6
    kind: controlplane
    patches:
      - apiVersion: v1alpha1
        kind: UnattendedInstallConfig
        provisioning:
          diskSelector:
            match: 'disk.size >= 500000000000u && disk.model == "Sabrent Rocket Q4"'
          wipe: false
      - apiVersion: v1alpha1
        kind: KubeNodeConfig
        labels:
          node.kubernetes.io/gpu: "true"
          topology.kubernetes.io/region: garb
          topology.kubernetes.io/zone: m
      - apiVersion: v1alpha1
        kind: BondConfig
        name: bond0
        links:
          - enp2s0f0np0
          - enp2s0f1np1
        bondMode: 802.3ad
        miimon: 100
        updelay: 200
        downdelay: 200
        xmitHashPolicy: layer3+4
        lacpRate: fast
        mtu: 9000
      - apiVersion: v1alpha1
        kind: DHCPv4Config
        name: bond0
      - apiVersion: v1alpha1
        kind: Layer2VIPConfig
        name: 192.168.60.250
        link: bond0

  talos-m3:
    ip: 192.168.60.7
    kind: controlplane
    patches:
      - apiVersion: v1alpha1
        kind: UnattendedInstallConfig
        provisioning:
          diskSelector:
            match: 'disk.size >= 500000000000u && disk.model == "Samsung SSD 990 PRO 1TB"'
          wipe: false
      - apiVersion: v1alpha1
        kind: KubeNodeConfig
        labels:
          node.kubernetes.io/gpu: "true"
          topology.kubernetes.io/region: garb
          topology.kubernetes.io/zone: m
      - apiVersion: v1alpha1
        kind: BondConfig
        name: bond0
        links:
          - enp2s0f0np0
          - enp2s0f1np1
        bondMode: 802.3ad
        miimon: 100
        updelay: 200
        downdelay: 200
        xmitHashPolicy: layer3+4
        lacpRate: fast
        mtu: 9000
      - apiVersion: v1alpha1
        kind: DHCPv4Config
        name: bond0
      - apiVersion: v1alpha1
        kind: Layer2VIPConfig
        name: 192.168.60.250
        link: bond0
